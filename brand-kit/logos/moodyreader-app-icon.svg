    <path d="M-49 -46 l-9 -7" stroke="#191026" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="34" cy="-30" rx="13" ry="18" fill="#191026"/><circle cx="29" cy="-38" r="5" fill="#fff"/>
    <path d="M49 -46 l9 -7" stroke="#191026" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-56" cy="6" rx="15" ry="9" fill="#FF6B54" opacity=".5"/>
